name: Build Fuxi ath12k kernel with the 8 GB (full) RAM layout
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    uses: ./.github/workflows/kernel-adsp-battery.yml
    with:
      ram_layout: full
      artifact_name: fuxi-kernel-ath12k-full
      runner_label: macos-15-intel
      ath12k: true
