name: Control build (ath12k off) for the v13 display baseline
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    uses: ./.github/workflows/kernel-adsp-battery.yml
    with:
      ram_layout: full
      artifact_name: fuxi-kernel-v13wifi-ctl
      runner_label: macos-15-intel
      ath12k: false
      patch_name: kernel-ath12k-disp.patch
