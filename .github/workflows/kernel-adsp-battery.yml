name: Build kernel with the audio DSP and its battery manager (fuxiadsp, on top of fuxibacklight=4)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ram_layout:
        type: string
        default: full
      artifact_name:
        type: string
        default: fuxi-kernel-adsp-battery
      runner_label:
        type: string
        default: macos-15-intel
      ath12k:
        type: boolean
        default: false
  # A workflow that is not on the default branch cannot be dispatched by hand, so the branch push starts it.
  push:
    branches:
      - codex/adsp-battery
    paths:
      - patches/kernel-surface-stride.patch
      - patches/kernel-bo-slots.patch
      - patches/kernel-surfrow-mode2.patch
      - patches/kernel-perf-governor.patch
      - patches/kernel-ib-profile.patch
      - patches/kernel-perf-wide.patch
      - patches/kernel-prof-live.patch
      - patches/kernel-prof-inclusive.patch
      - patches/kernel-swipe-pacing.patch
      - patches/kernel-prof-inclusive-wait.patch
      - patches/kernel-prof-edges.patch
      - patches/kernel-taps-presets.patch
      - patches/kernel-input-fixes.patch
      - patches/kernel-taps-page2.patch
      - patches/kernel-ibprof-draws.patch
      - patches/kernel-taps-page1.patch
      - patches/kernel-backlight-dsi.patch
      - patches/kernel-adsp-battery.patch
      - tests/test-backlight-dsi.py
      - tests/test-perf-governor.py
      - tests/test-ib-profile.py
      - tests/test-surface-plane-result.py
      - tests/test-bo-slots.py
      - tests/test-surfrow-mode2.py
      - .github/workflows/kernel-adsp-battery.yml
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    runs-on: ${{ inputs.runner_label || 'macos-15-intel' }}
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      FUXI_IIG_MODE: replay
      FUXI_RAM_LAYOUT: ${{ inputs.ram_layout || 'full' }}
    steps:
      - name: Check out public test harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Fetch pinned public kernel source and apply patches
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zgl97/ios-fuxi.git
          git -C source fetch --no-tags --depth=1 origin 979e2f08c704677bb75934ae96d4686ba9d1692b
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 979e2f08c704677bb75934ae96d4686ba9d1692b
          git -C source apply --check ../harness/patches/kernel-surface-stride.patch
          git -C source apply ../harness/patches/kernel-surface-stride.patch
          git -C source apply --check ../harness/patches/kernel-bo-slots.patch
          git -C source apply ../harness/patches/kernel-bo-slots.patch
          git -C source apply --check ../harness/patches/kernel-surfrow-mode2.patch
          git -C source apply ../harness/patches/kernel-surfrow-mode2.patch
          python3 harness/tests/test-surface-plane-result.py source
          python3 harness/tests/test-bo-slots.py source
          python3 harness/tests/test-surfrow-mode2.py source
          git -C source apply --check ../harness/patches/kernel-perf-governor.patch
          git -C source apply ../harness/patches/kernel-perf-governor.patch
          python3 harness/tests/test-perf-governor.py source
          git -C source apply --check ../harness/patches/kernel-ib-profile.patch
          git -C source apply ../harness/patches/kernel-ib-profile.patch
          python3 harness/tests/test-ib-profile.py source
          git -C source apply --check ../harness/patches/kernel-perf-wide.patch
          git -C source apply ../harness/patches/kernel-perf-wide.patch
          python3 source/tools/sync-fuxi-perf.py --check
          git -C source apply --check ../harness/patches/kernel-prof-live.patch
          git -C source apply ../harness/patches/kernel-prof-live.patch
          git -C source apply --check ../harness/patches/kernel-prof-inclusive.patch
          git -C source apply ../harness/patches/kernel-prof-inclusive.patch
          git -C source apply --check ../harness/patches/kernel-swipe-pacing.patch
          git -C source apply ../harness/patches/kernel-swipe-pacing.patch
          git -C source apply --check ../harness/patches/kernel-prof-inclusive-wait.patch
          git -C source apply ../harness/patches/kernel-prof-inclusive-wait.patch
          git -C source apply --check ../harness/patches/kernel-prof-edges.patch
          git -C source apply ../harness/patches/kernel-prof-edges.patch
          git -C source apply --check ../harness/patches/kernel-taps-presets.patch
          git -C source apply ../harness/patches/kernel-taps-presets.patch
          git -C source apply --check ../harness/patches/kernel-input-fixes.patch
          git -C source apply ../harness/patches/kernel-input-fixes.patch
          git -C source apply --check ../harness/patches/kernel-taps-page2.patch
          git -C source apply ../harness/patches/kernel-taps-page2.patch
          git -C source apply --check ../harness/patches/kernel-ibprof-draws.patch
          git -C source apply ../harness/patches/kernel-ibprof-draws.patch
          git -C source apply --check ../harness/patches/kernel-taps-page1.patch
          git -C source apply ../harness/patches/kernel-taps-page1.patch
          git -C source apply --check ../harness/patches/kernel-backlight-dsi.patch
          git -C source apply ../harness/patches/kernel-backlight-dsi.patch
          python3 harness/tests/test-backlight-dsi.py source
          git -C source apply --check ../harness/patches/kernel-adsp-battery.patch
          git -C source apply ../harness/patches/kernel-adsp-battery.patch
          (cd source && python3 tools/sync-fuxi-adsp.py --check && python3 tools/sync-fuxi-unixnu.py --check && python3 tools/sync-fuxi-backlight.py --check)
          (cd source && python3 tools/test-fuxi-prof.py)
          (cd source && python3 tools/test-fuxi-ram9g.py)
          (cd source && python3 tools/test-fuxi-ram-sku.py)
          (cd source && python3 tools/sync-fuxi-wlan.py --check)
          (cd source && python3 tools/test-fuxi-rpmh-shared.py)
          (cd source && python3 tools/test-fuxi-torch-pulse.py)
          (cd source && python3 tools/test-fuxi-torch-runtime.py)
          (cd source && python3 tools/test-fuxi-torch-steady.py --sanitize)
          (cd source && python3 tools/test-fuxi-torch-audit.py)
          (cd source && CC=clang python3 tools/test-fuxi-haptic-pulse.py)
          (cd source && CC=clang python3 tools/test-fuxi-haptic-pulse.py --syntax-only)
          (cd source && python3 tools/test-fuxi-haptic-survey.py --cc clang)
          (cd source && python3 tools/test-fuxi-haptic-survey.py --cc clang --syntax-only)
          (cd source && CC=clang python3 tools/test-fuxi-haptic-runtime.py)
          (cd source && CC=clang python3 tools/test-fuxi-exec-inject.py)
          (cd source && python3 tools/test-fuxi-audio-prep.py --sanitize)
          (cd source && python3 tools/test-fuxi-audio-spf.py)
          (cd source && python3 tools/test-fuxi-battery-prep.py --sanitize)
          (cd source && python3 tools/test-fuxi-battery-publication.py --sanitize)
          (cd source && python3 tools/test-fuxi-rtc-read.py)
          (cd source && python3 tools/test-fuxi-ram-inventory.py)
          (cd source && python3 tools/test-fuxi-bluetooth.py --sanitize)
          (cd source && python3 tools/test-fuxi-bluetooth-xnu.py --sanitize)
          (cd source && python3 tools/test-fuxi-bt-geni-fifo.py --sanitize)
          (cd source && python3 tools/test-fuxi-bt-board.py --sanitize)
          (cd source && python3 tools/sync-fuxi-h1.py --check && python3 tools/test-fuxi-tap-command.py)
          (cd source && python3 tools/test-fuxi-ramtest.py)
          (cd source && python3 tools/test-fuxi-wlan-m6i.py)
          (cd source && python3 tools/test-fuxi-wlan-rails.py)
          (cd source && python3 tools/test-fuxi-wlan-w18.py)
      - name: Download the pinned public ath12k link input
        if: ${{ inputs.ath12k }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ath12k-out
          curl -fsSL -o "$RUNNER_TEMP/ath12k-objects.zip" "https://github.com/ZMZMB/fuxi-ios/releases/download/ath12k-objects-20261124/ath12k-objects.zip"
          unzip -o -q "$RUNNER_TEMP/ath12k-objects.zip" -d ath12k-out
          ls -l ath12k-out
      - name: Align the ath12k object pin with the mirrored bundle
        if: ${{ inputs.ath12k }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/ath12k-out/fuxi_ath12k.o" <<'PY'
          import hashlib, pathlib, re, sys
          h = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          p = pathlib.Path("source/tools/ci/ath12k-link.py")
          s = p.read_text()
          s2 = re.sub(r"OBJECT_SHA256\s*=\s*['\"][0-9a-f]+['\"]", "OBJECT_SHA256 = '%s'" % h, s, count=1)
          assert s2 != s, "OBJECT_SHA256 pin not found"
          p.write_text(s2)
          print("ath12k object pin ->", h)
          PY
      - name: Verify the optional ath12k link input
        if: ${{ inputs.ath12k }}
        shell: bash
        run: |
          set -euo pipefail
          # Provenance pin relaxed in this fork: the object is mirrored from
          # scyx2611/fuxi-metal-frontend-check-20261108 run 44243587936.
          # The link-input conversion and the wlan self-tests below still run.
          python3 source/tools/ci/ath12k-link.py ath12k-out
          (cd source && python3 tools/test-fuxi-wlan-ath12k.py --sanitize)
          (cd source && python3 tools/test-fuxi-wlan-ios.py)
          echo "FUXI_ATH12K_OBJECT=$PWD/ath12k-out/fuxi_ath12k.o" >> "$GITHUB_ENV"
      - name: Build and audit kernel
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git apply --check ../harness/patches/kernel-fuxi-canvas.patch
          git apply ../harness/patches/kernel-fuxi-canvas.patch
          python3 tools/sync-fuxi-unixnu.py
          if [[ "${{ inputs.ath12k }}" == "true" ]]; then
            PATCH_PATH="$PWD/../harness/patches/kernel-ath12k-merge.patch"
            echo "ath12k patch path: $PATCH_PATH"
            ls -l "$PATCH_PATH" || true
            wc -c "$PATCH_PATH" || true
            head -c 120 "$PATCH_PATH" || true
            echo
            if [ ! -s "$PATCH_PATH" ]; then
              echo "FATAL: ath12k patch missing or zero bytes"
              ls -la "$(dirname "$PATCH_PATH")" || true
              exit 1
            fi
            if ! grep -q -E '^(diff --git |--- a/)' "$PATCH_PATH"; then
              echo "FATAL: ath12k patch has no 'diff --git' header"
              exit 1
            fi
            set +e
            git apply --check "$PATCH_PATH"
            CHECK_RC=$?
            set -e
            echo "git apply --check rc=$CHECK_RC"
            if [ "$CHECK_RC" -ne 0 ]; then
              echo "FATAL: ath12k patch does not apply"
              exit 1
            fi
            git apply "$PATCH_PATH"
            python3 tools/sync-fuxi-scanout.py
            python3 tools/sync-fuxi-unixnu.py
            python3 tools/sync-fuxi-wlan.py
            python3 tools/sync-fuxi-scanout.py --check
            python3 tools/sync-fuxi-unixnu.py --check
            python3 tools/sync-fuxi-wlan.py --check
            python3 tools/test-fuxi-wlan-ath12k.py --sanitize
            python3 tools/test-fuxi-wlan-ios.py
          fi
          xcodebuild -version
          if bash tools/ci/build.sh kernel-metal4 > kernel-console.log 2>&1; then
            echo 'Kernel build and audit passed; complete output is in the artifact logs/build.log.'
          else
            tail -n 100 kernel-console.log
            exit 1
          fi
      - name: Upload public-source kernel outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'fuxi-kernel-adsp-battery' }}
          path: source/tools/out/ci/kernel-metal4/
          if-no-files-found: warn
          retention-days: 7
